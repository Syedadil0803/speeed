<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeedStack - Coming Soon</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
  </div>
  <!-- Particle Background Canvas -->
  <canvas id="particles"></canvas>
  
  <div class="container-fluid main-container">
    <div class="row min-vh-100">
      <div class="col-lg-10 col-xl-8 mx-auto my-auto">
        
        <!-- Logo & Header -->
        <header class="text-center mb-5">
          <div class="logo-container">
            <h1 class="company-name">SpeedStack</h1>
          </div>
        </header>
        
        <!-- Main Content -->
        <main class="text-center">
          <div class="light-bulb-container">
            <div class="light-bulb">
              <div class="bulb-glow"></div>
            </div>
            <div class="bulb-string"></div>
          </div>
          
          <div class="stay-tuned">STAY TUNED</div>
          
          <div class="coming-soon-container">
            <h2 class="coming-soon">COMING SOON</h2>
          </div>
          
          <div class="description-container mt-4">
            <p class="description">
              We're building the next generation of software development services.
              <span class="d-block my-2">Faster. Smarter. Better.</span>
            </p>
          </div>
          
        
        </main>
        
        <!-- Footer with Social Links -->
        <footer class="mt-5 text-center">
       
          <div class="copyright mt-4">
            <p>&copy; 2025 SpeedStack. All rights reserved...</p>
          </div>
        </footer>
        
      </div>
    </div>
  </div>
</body>
  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JavaScript -->
  <script src="js/particles.js" defer></script>
  <script src="js/main.js" defer></script>
</html>
